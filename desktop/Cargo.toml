[package]
name = "undertrained-indoor"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native indoor cycling companion"

[dependencies]
rusb = { version = "0.9", features = ["vendored"] }
sys-locale = "0.3"
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
btleplug = "0.12"
futures = "0.3"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[build-dependencies]
slint-build = "1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
